<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Smart Jewellery Cost Calculator — scan tags and price jewellery offline.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Jewellery Cost">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Jewellery Cost</title>
  <meta name="theme-color" content="#A8843A">
  <!-- In-browser OCR (Tesseract.js). Uses assets bundled under ocr/ when
       present (see tool/bundle_web_ocr.sh) so scanning works offline;
       otherwise falls back to the CDN. -->
  <script src="ocr/tesseract.min.js"
          onload="window.jcOcrLocal = true"
          onerror="this.remove(); var s = document.createElement('script');
                   s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
                   document.head.appendChild(s);"></script>
  <script>
    // Called from Dart (lib/ocr/ocr_service_web.dart). Reuses one worker.
    window.jcRecognize = async function (image) {
      if (typeof Tesseract === 'undefined') throw new Error('OCR engine not loaded');
      if (!window.jcOcrWorker) {
        var opts = window.jcOcrLocal
          ? { workerPath: 'ocr/worker.min.js', corePath: 'ocr/core', langPath: 'ocr/lang' }
          : {};
        window.jcOcrWorker = Tesseract.createWorker('eng', 1, opts);
      }
      var worker = await window.jcOcrWorker;
      var result = await worker.recognize(image);
      return result.data.text;
    };
  </script>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
