<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Damiyaas Jewelers — jewellery cost calculator.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <!-- iPhone "Add to Home Screen": full-screen app with its own icon. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Damiyaas">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Damiyaas Jewelers</title>
  <meta name="theme-color" content="#A8843A">
  <!-- In-browser OCR: PaddleOCR on ONNX Runtime Web, bundled under ocr/
       by tool/bundle_web_ocr.sh (no CDN). The engine starts loading as
       soon as the app opens so the first scan does not wait for it. -->
  <script type="module">
    window.jcOcrReady = import('./ocr/jcocr.js').then(
      () => {
        // Start loading the models once the app has drawn its first screen.
        setTimeout(() => window.jcOcr.warmUp().catch(() => {}), 1500);
        return true;
      },
      () => false);
  </script>
  <script>
    // Called from Dart (lib/ocr/ocr_service_web.dart).
    window.jcRecognize = async function (imageUrl) {
      if (!(await window.jcOcrReady)) throw new Error('OCR engine not loaded');
      return window.jcOcr.recognize(imageUrl);
    };
  </script>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
