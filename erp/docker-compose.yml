# Cloud / hybrid server: the ERP plus PostgreSQL. Shops created as CLOUD get a database each
# (jewel_<shopcode>); shops created as LOCAL keep an H2 file under the /data volume.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${ERP_PG_PASSWORD:-change-me}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 10
  erp:
    build: .
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["8080:8080"]
    environment:
      ERP_PG_HOST: postgres
      ERP_PG_PASSWORD: ${ERP_PG_PASSWORD:-change-me}
      ERP_PLATFORM_PASSWORD: ${ERP_PLATFORM_PASSWORD:-change-me-too}
      ERP_DEMO_STORAGE: CLOUD
    volumes: [erpdata:/data]
volumes:
  pgdata:
  erpdata:
