name: Publish web app (GitHub Pages)

# The web version runs on iPhone (Safari → Share → Add to Home Screen),
# Android and desktop browsers. Published from main on every update.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: flutter pub get
      - run: flutter test

      # Served from https://<owner>.github.io/<repo>/ ; all engine files are
      # bundled (no CDN), so the app keeps working on a poor connection.
      - name: Build web app
        run: |
          flutter build web --release --no-web-resources-cdn \
            --base-href "/${{ github.event.repository.name }}/"

      # Bundle the OCR engine + English model so scanning needs no CDN.
      - name: Bundle OCR assets
        run: ./tool/bundle_web_ocr.sh build/web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
