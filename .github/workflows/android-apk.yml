name: Build Android APK

on:
  push:
    branches: [main, claude/eager-galileo-60fxni]
  workflow_dispatch:

permissions:
  contents: write # to publish the APK as a release asset

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk jewellery-cost-calculator.apk

      - uses: actions/upload-artifact@v4
        with:
          name: jewellery-cost-calculator-apk
          path: jewellery-cost-calculator.apk
          retention-days: 30

      # Direct-download link for installing on a phone (no zip, no login).
      - name: Publish APK as a test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-test-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Android test build ${{ github.run_number }}
          prerelease: true
          files: jewellery-cost-calculator.apk
          body: |
            Test build of the Smart Jewellery Cost Calculator from `${{ github.ref_name }}` (${{ github.sha }}).
            On the phone: open this page, download **jewellery-cost-calculator.apk**, allow
            "Install unknown apps" for your browser when asked, then install.
            Signed with a debug key — for testing only, not for the Play Store.
