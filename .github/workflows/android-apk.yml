name: Build Android APK

on:
  push:
    branches: [main, claude/eager-galileo-60fxni]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk jewellery-cost-calculator.apk

      - uses: actions/upload-artifact@v4
        with:
          name: jewellery-cost-calculator-apk
          path: jewellery-cost-calculator.apk
          retention-days: 30
