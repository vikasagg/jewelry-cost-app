name: Build Android APK

on:
  push:
    branches: [main, claude/eager-galileo-60fxni]
  workflow_dispatch:

permissions:
  contents: write # to publish the APK as a release asset

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk jewellery-cost-calculator.apk

      - uses: actions/upload-artifact@v4
        with:
          name: jewellery-cost-calculator-apk
          path: jewellery-cost-calculator.apk
          retention-days: 30

      # main -> versioned release (Latest); other branches -> test pre-release.
      - name: Release details
        id: rel
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=v1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "name=Damiyaas Jewelers v1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=android-test-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "name=Android test build ${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      # Direct-download link for installing on a phone (no zip, no login).
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.rel.outputs.name }}
          prerelease: ${{ steps.rel.outputs.prerelease }}
          make_latest: ${{ steps.rel.outputs.prerelease == 'false' }}
          files: jewellery-cost-calculator.apk
          body: |
            Damiyaas Jewelers — jewellery cost calculator for Android, built from `${{ github.ref_name }}` (${{ github.sha }}).
            On the phone: open this page, download **jewellery-cost-calculator.apk**, allow
            "Install unknown apps" for your browser when asked, then install over the previous version
            (saved rates and history are kept).
            Signed with a debug key — for direct installation, not for the Play Store.
