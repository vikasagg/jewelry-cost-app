# Cloud / hybrid server: Swarn-OS plus PostgreSQL. Shops created as CLOUD get a database each
# (swarnos_<shopcode>); shops created as LOCAL keep an H2 file under the /data volume.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${SWARN_PG_PASSWORD:-change-me}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 10
  swarn-os:
    build: .
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["8080:8080"]
    environment:
      SWARN_PG_HOST: postgres
      SWARN_PG_PASSWORD: ${SWARN_PG_PASSWORD:-change-me}
      SWARN_PLATFORM_PASSWORD: ${SWARN_PLATFORM_PASSWORD:-change-me-too}
      SWARN_DEMO_STORAGE: CLOUD
    volumes: [erpdata:/data]
volumes:
  pgdata:
  erpdata:
